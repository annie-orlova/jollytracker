name: Update tracker data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Google Sheet
        run: |
          curl -L --fail \
          "https://docs.google.com/spreadsheets/d/e/2PACX-1vR0zkiJrRD_kO7l2fhsPAYyhNRzzwm46grALJVRK9zN2dCE0WQ6ev97HypIuMwpeGYy9nVH1y2SCzYf/pub?output=csv" \
          -o data.csv

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.csv
          git diff --cached --quiet || git commit -m "Update tracker data"
          git push
